name: Deploy landing production
on:
    workflow_dispatch:
permissions:
    contents: read
    actions: read
    id-token: write
jobs:
    deploy:
        uses: NextNodeSolutions/core/.github/workflows/deploy.yml@main
        with:
            environment: production
            config_file: apps/landing/nextnode.toml
            dev_workflow_file: deploy-landing-dev.yml
