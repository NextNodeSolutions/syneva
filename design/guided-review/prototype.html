<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Syneva — guided review prototype</title>
		<style>
			/* Tokens: the design system's palette (packages/design-system/src/tokens.stylex.ts). Light default, night under [data-appearance=dark]. */
			:root {
				--paper: #f6f6f0;
				--white: #fff;
				--field: #eef0e7;
				--grid: #e4e7dc;
				--line: #dcdfd4;
				--line-strong: #a8afa1;
				--ink: #191b18;
				--muted: #60635c;
				--accent: #0e6582;
				--accent-deep: #0b506a;
				--accent-line: #8eb5bf;
				--signal: #1888b0;
				--wash: #dcedf4;
				--wash-tint: #eff7fa;
				--wash-ink: #2f5566;
				--green: #35633f;
				--green-line: #a9c6a5;
				--mint: #e0eddf;
				--mint-tint: #eef5ec;
				--amber: #875a0e;
				--amber-line: #d8bd86;
				--amber-tint: #f6ecd6;
				--red: #a8322d;
				--red-line: #e2aea6;
				--red-tint: #f8e7e3;
				--red-pale: #fbefec;
				--sans: Geist, system-ui, sans-serif;
				--mono:
					'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
				--topbar: 48px;
				--subbar: 40px;
				--left: 260px;
				--explain: 380px;
			}
			[data-appearance='dark'] {
				--paper: #101210;
				--white: #171a17;
				--field: #1d211d;
				--grid: #1b1f1b;
				--line: #272b27;
				--line-strong: #3c423c;
				--ink: #e4e6de;
				--muted: #9ca196;
				--accent: #62b2cd;
				--accent-line: #2c5d6c;
				--signal: #4cb2db;
				--wash: #132830;
				--wash-tint: #0f1d22;
				--wash-ink: #a9d0dd;
				--green: #80c48c;
				--green-line: #2f4a34;
				--mint: #1a2a1d;
				--mint-tint: #16211a;
				--amber: #d9a650;
				--amber-line: #5a4420;
				--amber-tint: #2a2214;
				--red: #e9827a;
				--red-line: #5a2a27;
				--red-tint: #2a1815;
				--red-pale: #231614;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				font: 12px/1.5 var(--sans);
				color: var(--ink);
				background: var(--paper);
				-webkit-font-smoothing: antialiased;
				overflow: hidden;
			}
			button,
			input,
			textarea {
				font: inherit;
				color: inherit;
			}
			button {
				cursor: pointer;
			}
			:is(
				button,
				[role='button'],
				a,
				textarea,
				[tabindex]
			):focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			kbd {
				font-family: var(--sans);
				font-size: 10px;
				padding: 0 4px;
				border: 1px solid var(--line-strong);
				background: var(--white);
				line-height: 1.4;
				color: var(--muted);
			}
			.label {
				font: 500 10px/1.3 var(--mono);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.mono {
				font-family: var(--mono);
			}
			.tag {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 2px 6px;
				font: 500 10.5px/1.5 var(--mono);
				letter-spacing: 0.04em;
				white-space: nowrap;
			}
			.tag[data-risk='critical'] {
				color: var(--red);
				background: var(--red-tint);
			}
			.tag[data-risk='high'] {
				color: var(--amber);
				background: var(--amber-tint);
			}
			.tag[data-risk='medium'] {
				color: var(--accent);
				background: var(--wash);
			}
			.tag[data-risk='low'] {
				color: var(--muted);
				background: var(--field);
			}
			.tag.verdict-pending {
				color: var(--muted);
				background: var(--field);
			}
			.tag.verdict-done {
				color: var(--green);
				background: var(--mint);
			}
			.tag.verdict-objection {
				color: var(--amber);
				background: var(--amber-tint);
			}
			.tag.stale {
				color: var(--amber);
				background: var(--amber-tint);
			}
			.tag.petrol {
				color: var(--accent);
				background: var(--wash);
			}
			.ctl {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				min-height: 22px;
				padding: 2px 7px;
				border: 1px solid var(--line-strong);
				background: var(--white);
				font-size: 11px;
				font-weight: 500;
				line-height: 1.2;
				white-space: nowrap;
			}
			.ctl:hover {
				color: var(--accent);
				border-color: var(--accent);
				background: var(--wash);
			}
			.ctl.quiet {
				border-color: transparent;
				background: transparent;
				color: var(--muted);
			}
			.ctl.quiet:hover {
				background: var(--field);
				color: var(--ink);
			}
			.ctl.primary {
				background: var(--accent);
				border-color: var(--accent);
				color: var(--white);
			}
			.ctl.primary:hover {
				background: var(--accent-deep);
				border-color: var(--accent-deep);
				color: var(--white);
			}
			.ctl.ask {
				color: var(--accent);
				background: var(--wash);
				border-color: var(--accent-line);
			}
			.ctl.request {
				color: var(--amber);
				background: var(--amber-tint);
				border-color: var(--amber-line);
			}
			.ctl.keep {
				color: var(--white);
				background: var(--green);
				border-color: transparent;
			}
			.ctl.on {
				color: var(--accent);
				background: var(--wash);
				border-color: var(--accent);
			}
			.ctl[disabled] {
				opacity: 0.55;
				pointer-events: none;
			}

			/* Frame */
			.frame {
				height: 100%;
				display: grid;
				grid-template-rows: var(--topbar) minmax(0, 1fr);
			}
			.topbar {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				align-items: center;
				gap: 12px;
				padding: 0 14px;
				background: var(--paper);
				border-bottom: 1px solid var(--line);
				color: var(--muted);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				font-weight: 600;
				color: var(--ink);
				letter-spacing: -0.03em;
				font-size: 15px;
			}
			.brand .desk {
				font: 11px var(--mono);
				color: var(--muted);
				padding-left: 10px;
				border-left: 1px solid var(--line);
			}
			.topbar .center {
				display: flex;
				gap: 8px;
				justify-content: center;
				align-items: center;
			}
			.topbar .right {
				justify-self: end;
				display: flex;
				gap: 8px;
				align-items: center;
			}
			.progress {
				position: absolute;
				left: 0;
				right: 0;
				top: var(--topbar);
				height: 2px;
				background: transparent;
			}
			.progress i {
				display: block;
				height: 100%;
				background: var(--green);
				transition: width 0.45s;
			}
			.main {
				position: relative;
				min-height: 0;
				display: grid;
				grid-template-columns: var(--left) 1px var(
						--explain
					) 1px minmax(0, 1fr);
			}
			.main[data-pane='closed'] {
				grid-template-columns: var(--left) 1px minmax(0, 1fr);
			}
			.main[data-pane='closed'] .explain,
			.main[data-pane='closed'] .rule.explainRule {
				display: none;
			}
			.rule {
				background: var(--line);
			}
			.col {
				min-width: 0;
				min-height: 0;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			.aside {
				background: var(--paper);
			}
			.center {
				background: var(--white);
			}
			.explain {
				background: var(--paper);
			}
			.subbar {
				flex-shrink: 0;
				height: var(--subbar);
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 10px;
				border-bottom: 1px solid var(--line);
				background: var(--paper);
			}
			.tabs {
				display: flex;
				gap: 4px;
				height: var(--subbar);
				border-bottom: 1px solid var(--line);
				padding: 0 6px;
				flex-shrink: 0;
			}
			.tab {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 0 8px;
				margin-bottom: -1px;
				border: 0;
				border-bottom: 2px solid transparent;
				background: transparent;
				color: var(--muted);
				font-weight: 500;
			}
			.tab[aria-selected='true'] {
				color: var(--ink);
				border-bottom-color: var(--accent);
			}
			.pane {
				flex: 1 1 auto;
				min-height: 0;
				overflow: auto;
				padding: 8px;
			}

			/* Navigator */
			.nav-overview {
				padding: 8px 8px 10px;
				border-bottom: 1px solid var(--line);
			}
			.nav-overview .intent {
				font-size: 12px;
				line-height: 1.5;
				color: var(--ink);
				margin: 4px 0 6px;
			}
			.cover {
				display: flex;
				gap: 10px;
				font: 11px var(--mono);
				color: var(--muted);
			}
			.cover b {
				color: var(--ink);
				font-weight: 500;
			}
			.dom {
				display: block;
				width: 100%;
				text-align: left;
				padding: 8px 8px 8px 10px;
				border: 0;
				border-left: 2px solid transparent;
				background: transparent;
				color: var(--ink);
				position: relative;
			}
			.dom:hover {
				background: var(--field);
			}
			.dom[aria-current='true'] {
				background: var(--wash);
				border-left-color: var(--accent);
			}
			.dom .top {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.dom .title {
				font-size: 12.5px;
				font-weight: 500;
				flex: 1 1 auto;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.dom .n {
				font: 10px var(--mono);
				color: var(--muted);
			}
			.dom .conseq {
				margin: 3px 0 0;
				color: var(--muted);
				font-size: 11px;
				line-height: 1.45;
				display: -webkit-box;
				-webkit-line-clamp: 2;
				-webkit-box-orient: vertical;
				overflow: hidden;
			}
			.dom .meter {
				margin-top: 6px;
				height: 3px;
				background: var(--line);
				position: relative;
			}
			.dom .meter i {
				position: absolute;
				inset: 0 auto 0 0;
				background: var(--green);
			}
			.dom .meter em {
				position: absolute;
				inset: 0 auto 0 0;
				background: var(--amber);
				opacity: 0.9;
			}
			.dom .foot {
				display: flex;
				justify-content: space-between;
				margin-top: 4px;
				font: 10px var(--mono);
				color: var(--muted);
			}
			.unassigned {
				margin-top: 10px;
				padding: 8px 10px;
				border: 1px dashed var(--amber-line);
				background: var(--amber-tint);
				color: var(--amber);
				font-size: 11px;
			}
			.unassigned b {
				display: block;
				font-weight: 600;
				margin-bottom: 2px;
			}
			.filelist {
				margin: 0;
				padding: 0;
				list-style: none;
			}
			.filelist li {
				display: flex;
				gap: 6px;
				align-items: center;
				min-height: 26px;
				padding: 3px 8px;
				font: 11.5px var(--mono);
				color: var(--muted);
				cursor: pointer;
			}
			.filelist li:hover {
				background: var(--field);
				color: var(--ink);
			}
			.filelist li .k {
				width: 7px;
				height: 7px;
				background: var(--accent);
			}
			.filelist li .k.add {
				background: var(--green);
			}
			.filelist li .k.del {
				background: var(--red);
			}
			.filelist li[data-active] {
				background: var(--wash);
				color: var(--ink);
			}
			.sideFoot {
				flex-shrink: 0;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 10px 16px;
				border-top: 1px solid var(--line);
				color: var(--muted);
			}

			/* Explanation pane */
			.exHead {
				padding: 12px 14px 10px;
				border-bottom: 1px solid var(--line);
				background: var(--paper);
			}
			.exHead .row {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
			}
			.exHead h2 {
				margin: 6px 0 4px;
				font-size: 17px;
				font-weight: 500;
				letter-spacing: -0.03em;
				line-height: 1.25;
			}
			.exHead .summary {
				margin: 0;
				font-size: 13px;
				line-height: 1.6;
				color: var(--ink);
			}
			.exHead .navs {
				display: flex;
				gap: 4px;
				margin-left: auto;
			}
			.consequence {
				margin: 10px 0 0;
				padding: 8px 11px;
				border-left: 2px solid var(--red-line);
				background: var(--white);
				font-size: 12px;
				line-height: 1.5;
			}
			.consequence[data-risk='high'] {
				border-left-color: var(--amber-line);
			}
			.consequence[data-risk='medium'] {
				border-left-color: var(--accent-line);
			}
			.consequence[data-risk='low'] {
				border-left-color: var(--line-strong);
			}
			.consequence .label {
				display: block;
				margin-bottom: 2px;
			}
			.exBody {
				flex: 1 1 auto;
				min-height: 0;
				overflow: auto;
				padding: 12px 14px 20px;
			}
			.sec {
				margin-bottom: 16px;
			}
			.sec > .label {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 6px;
			}
			.sec > .label .count {
				color: var(--ink);
				letter-spacing: 0;
				text-transform: none;
			}
			.prereq {
				padding: 8px 10px;
				background: var(--white);
				border: 1px solid var(--line);
				font-size: 12px;
				line-height: 1.5;
			}
			.prereq a {
				color: var(--accent);
				text-decoration: none;
				font-weight: 500;
			}
			.prereq a:hover {
				text-decoration: underline;
			}
			.cov {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			.cov button {
				display: flex;
				align-items: center;
				gap: 8px;
				width: 100%;
				text-align: left;
				padding: 5px 8px;
				border: 1px solid transparent;
				background: transparent;
				font: 11.5px var(--mono);
				color: var(--ink);
			}
			.cov button:hover {
				background: var(--white);
				border-color: var(--line);
			}
			.cov button .lines {
				color: var(--muted);
			}
			.cov button .st {
				margin-left: auto;
			}
			.cov button[data-current] {
				border-color: var(--accent-line);
				background: var(--wash);
			}
			.block {
				margin-bottom: 14px;
				background: var(--white);
				border: 1px solid var(--line);
			}
			.block > .bh {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 7px 10px;
				border-bottom: 1px solid var(--line);
			}
			.block > .bh .kind {
				font: 500 10px var(--mono);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.block > .bh .t {
				font-size: 12.5px;
				font-weight: 500;
			}
			.block > .bb {
				padding: 10px 12px;
				font-size: 12.5px;
				line-height: 1.6;
			}
			.block > .bb p {
				margin: 0 0 8px;
			}
			.block > .bb p:last-child {
				margin-bottom: 0;
			}
			.block > .bb code {
				font-family: var(--mono);
				font-size: 11.5px;
				padding: 0 3px;
				background: var(--field);
			}
			.block.failed .bb {
				color: var(--muted);
			}
			.failNote {
				padding: 6px 10px;
				border-top: 1px dashed var(--amber-line);
				color: var(--amber);
				font-size: 11px;
			}
			details.more {
				margin-top: 8px;
				border-top: 1px solid var(--line);
				padding-top: 6px;
			}
			details.more summary {
				cursor: pointer;
				color: var(--accent);
				font-weight: 500;
				font-size: 11.5px;
				list-style: none;
				display: inline-flex;
				gap: 6px;
				align-items: center;
			}
			details.more summary::before {
				content: '▸';
				font-size: 10px;
			}
			details.more[open] summary::before {
				content: '▾';
			}
			details.more .dm {
				margin-top: 6px;
				color: var(--ink);
			}
			.ref {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				padding: 1px 6px;
				border: 1px solid var(--accent-line);
				background: var(--white);
				color: var(--accent);
				font: 11px var(--mono);
				vertical-align: 1px;
			}
			.ref:hover {
				background: var(--wash);
			}
			.ref.context {
				border-style: dashed;
				color: var(--wash-ink);
			}
			.ref.unresolved {
				border-color: var(--amber-line);
				color: var(--amber);
				text-decoration: line-through;
				text-decoration-color: var(--amber-line);
			}
			.ref.unresolved::after {
				content: 'unresolved';
				text-decoration: none;
				font-size: 9.5px;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			.ba {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 1px;
				background: var(--line);
			}
			.ba > div {
				background: var(--white);
				padding: 8px 10px;
			}
			.ba .label {
				margin-bottom: 4px;
			}
			.ba .before .label {
				color: var(--red);
			}
			.ba .after .label {
				color: var(--green);
			}
			.evid {
				margin: 0;
				padding: 0;
				list-style: none;
			}
			.evid li {
				padding: 5px 0;
				border-bottom: 1px solid var(--line);
				font-size: 12px;
				line-height: 1.5;
				display: flex;
				gap: 8px;
				align-items: baseline;
			}
			.evid li::before {
				content: '';
				width: 6px;
				height: 6px;
				flex-shrink: 0;
				background: var(--accent);
				transform: translateY(-1px);
			}
			.unk li::before {
				background: var(--line-strong);
			}
			.staleBanner {
				display: flex;
				gap: 8px;
				align-items: flex-start;
				padding: 8px 11px;
				margin: 0 14px;
				margin-top: 10px;
				background: var(--amber-tint);
				border: 1px solid var(--amber-line);
				color: var(--amber);
				font-size: 11.5px;
				line-height: 1.45;
			}
			.staleBanner b {
				font-weight: 600;
			}

			/* Diagrams */
			.diagram {
				position: relative;
				overflow: auto;
				max-height: 360px;
				padding: 8px;
			}
			.diagram svg {
				display: block;
				max-width: 100%;
				height: auto;
				font-family: var(--sans);
			}
			.diagram .node rect,
			.diagram .node ellipse {
				fill: var(--white);
				stroke: var(--line-strong);
				stroke-width: 1;
			}
			.diagram .node text {
				fill: var(--ink);
				font-size: 11px;

				)
				const failed = S.scenario === 'reload' && b.id === 'flow'
				const drawn = ['state', 'sequence', 'flow'].includes(b.kind) ? diagram(d, b) : null
				let body = ''
				// The text equivalent is rendered on its own, so a diagram that cannot be drawn still explains the relationships.
				if (failed)
					body = `<div class="failNote">The diagram could not be drawn in this session; its text equivalent is kept and the rest of the desk is unaffected.</div><details class="textEq" open><summary>As text</summary>${drawn ? drawn.text : ''}</details>`
				else if (b.kind === 'prose')
					body = `<div class="bb"><p>${md(b.markdown)}</p></div>`
				else if (b.kind === 'before-after')
					body = `<div class="ba"><div class="before"><div class="label">${esc(b.before.label || 'Before')}</div>${md(b.before.markdown)} ${b.before.ref ? refChip(d, b.before.ref) : ''}</div><div class="after"><div class="label">${esc(b.after.label || 'After')}</div>${md(b.after.markdown)} ${b.after.ref ? refChip(d, b.after.ref) : ''}</div></div>`
				else body = `<div class="diagram">${drawn.svg}</div><details class="textEq"><summary>As text</summary>${drawn.text}</details>`
				const refs = (b.refs || []).map(r => refChip(d, r)).join(' ')
				const detail = b.detail
					? `<details class="more" ${S.expanded.has(d.id + ':' + b.id) ? 'open' : ''} data-detail="${d.id}:${b.id}"><summary>Reasoning, assumptions, failure cases</summary><div class="dm">${md(b.detail)}</div></details>`
					: ''
				return `<div class="block ${failed ? 'failed' : ''}" id="block-${b.id}"><div class="bh"><span class="kind">${kindLabel}</span><span class="t">${esc(b.title || '')}</span><span class="blockActs"><button class="ctl quiet" data-compose="${d.id}" data-block="${b.id}" data-intent="question" title="Ask about this explanation">Ask</button><button class="ctl quiet" data-compose="${d.id}" data-block="${b.id}" data-intent="action" title="Request a change here">Request</button></span></div>${body}${refs || detail ? `<div class="bb" style="padding-top:6px;border-top:1px solid var(--line)">${refs ? `<div><span class="label" style="margin-right:6px">Refs</span>${refs}</div>` : ''}${detail}</div>` : ''}${threads.length || (S.composer && S.composer.domainId === d.id && S.composer.blockId === b.id) ? `<div class="bb" style="padding-top:0"><div class="thread">${threads.map(renderThread).join('')}${S.composer && S.composer.domainId === d.id && S.composer.blockId === b.id ? renderComposer() : ''}</div></div>` : ''}</div>`
			}
			function renderThread(t) {
				const tag =
					t.intent === 'question'
						? '<span class="tag petrol">Question</span>'
						: '<span class="tag verdict-objection">Change requested</span>'
				const state = t.stale
					? '<span class="tag stale">stale</span>'
					: t.replies.length
						? '<span class="tag verdict-done">answered</span>'
						: '<span class="tag verdict-pending">waiting</span>'
				return `<div class="msg"><div class="meta"><b>You</b>${tag}${state}<span>${t.target.blockId ? 'on block ' : 'on domain'}</span></div>${esc(t.body)}</div>${t.replies.map(r => `<div class="msg agent"><div class="meta"><b>Agent</b><span>now</span></div>${esc(r)}</div>`).join('')}`
			}
			function renderComposer() {
				const c = S.composer
				const d = currentDomain()
				const b = c.blockId
					? d.blocks.find(x => x.id === c.blockId)
					: null
				return `<div class="compose"><div class="target">${b ? 'On the “' + esc(b.title || b.kind) + '” block' : 'On the domain'} · ${esc(d.title)}${units(d).length ? ' · ' + units(d).length + ' linked changes' : ''}</div><textarea id="composerText" placeholder="${c.intent === 'question' ? 'What do you want the agent to explain?' : 'What should change in this behavior?'}" aria-label="Comment">${esc(c.body || '')}</textarea><div class="acts"><button class="ctl quiet" id="composerCancel">Cancel <kbd>Esc</kbd></button><button class="ctl ask" id="composerAsk">Ask <kbd>⌘⇧↵</kbd></button><button class="ctl request" id="composerRequest">Request change <kbd>⌘↵</kbd></button></div></div>`
			}

			// ---------- Diagrams (inline SVG from typed data; text equivalent always present) ----------
			const ARROW =
				'<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line-strong)"/></marker></defs>'
			function node(d, x, y, w, h, label, ref, cls) {
				const linked = ref && !S.unresolved.has(d.id + ':' + ref)
				const un = ref && S.unresolved.has(d.id + ':' + ref)
				return `<g class="node ${linked ? 'linked' : ''} ${cls || ''}" ${ref ? `data-ref="${d.id}:${ref}" tabindex="0" role="button" aria-label="${esc(label)}${linked ? ', opens the code' : un ? ', target unresolved' : ''}"` : ''}><rect x="${x}" y="${y}" width="${w}" height="${h}" ${un ? 'stroke-dasharray="4 3"' : ''}/><text x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle">${esc(label)}${linked ? ' ↗' : ''}</text></g>`
			}
			function edgeLabel(x, y, t) {
				return t
					? `<text x="${x}" y="${y}" text-anchor="middle">${esc(t)}</text>`
					: ''
			}
			function diagram(d, b) {
				let svg = '',
					text = ''
				if (b.kind === 'state') {
					const W = 120,
						H = 34,
						gap = 70
					const n = b.states.length
					const width = n * W + (n - 1) * gap + 20
					const pos = Object.fromEntries(
						b.states.map((s, i) => [
							s.id,
							{ x: 10 + i * (W + gap), y: 60 },
						]),
					)
					svg =
						`<svg viewBox="0 0 ${width} 150" width="${width}" height="150" role="img" aria-label="State diagram: ${esc(b.title || '')}">${ARROW}` +
						b.transitions
							.map(t => {
								const a = pos[t.from],
									c = pos[t.to]
								const back =
									b.states.findIndex(s => s.id === t.from) >
									b.states.findIndex(s => s.id === t.to)
								const linked =
									t.ref &&
									!S.unresolved.has(d.id + ':' + t.ref)
								if (back) {
									const x1 = a.x + W / 2,
										x2 = c.x + W / 2
									return `<g class="edge ${linked ? 'linked' : ''}" ${t.ref ? `data-ref="${d.id}:${t.ref}" tabindex="0" role="button"` : ''}><path d="M${x1} ${a.y + H} C ${x1} ${a.y + H + 50}, ${x2} ${c.y + H + 50}, ${x2} ${c.y + H}"/>${edgeLabel((x1 + x2) / 2, a.y + H + 56, t.label)}</g>`
								}
								const x1 = a.x + W,
									x2 = c.x
								return `<g class="edge ${linked ? 'linked' : ''}" ${t.ref ? `data-ref="${d.id}:${t.ref}" tabindex="0" role="button"` : ''}><line x1="${x1}" y1="${a.y + H / 2}" x2="${x2}" y2="${c.y + H / 2}"/>${edgeLabel((x1 + x2) / 2, a.y + H / 2 - 6, t.label)}</g>`
							})
							.join('') +
						b.states
							.map(s =>
								node(
									d,
									pos[s.id].x,
									pos[s.id].y,
									W,
									H,
									s.label,
									s.ref,
									(s.initial ? 'initial' : '') +
										(s.final ? ' final' : ''),
								),
							)
							.join('') +
						'</svg>'
					text = `<ol>${b.transitions.map(t => `<li>${esc(b.states.find(s => s.id === t.from).label)} → ${esc(b.states.find(s => s.id === t.to).label)}${t.label ? ' on ' + esc(t.label) : ''}${t.ref ? ' (' + refChip(d, t.ref) + ')' : ''}</li>`).join('')}</ol>`
				} else if (b.kind === 'sequence') {
					const colW = 150,
						top = 30,
						step = 42
					const width = b.participants.length * colW + 20
					const height = top + 40 + b.steps.length * step
					const cx = Object.fromEntries(
						b.participants.map((p, i) => [
							p.id,
							10 + i * colW + colW / 2,
						]),
					)
					svg =
						`<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Sequence: ${esc(b.title || '')}">${ARROW}` +
						b.participants
							.map(
								p =>
									`<line class="lifeline" x1="${cx[p.id]}" y1="${top + 34}" x2="${cx[p.id]}" y2="${height}"/>` +
									node(
										d,
										cx[p.id] - 60,
										top,
										120,
										30,
										p.label,
									),
							)
							.join('') +
						b.steps
							.map((s, i) => {
								const y = top + 60 + i * step
								const x1 = cx[s.from],
									x2 = cx[s.to]
								const linked =
									s.ref &&
									!S.unresolved.has(d.id + ':' + s.ref)
								if (x1 === x2)
									return `<g class="edge ${linked ? 'linked' : ''}" ${s.ref ? `data-ref="${d.id}:${s.ref}" tabindex="0" role="button"` : ''}><path d="M${x1} ${y - 10} C ${x1 + 40} ${y - 10}, ${x1 + 40} ${y + 10}, ${x1} ${y + 10}"/>${edgeLabel(x1 + 70, y + 3, s.label)}</g>`
								return `<g class="edge ${linked ? 'linked' : ''}" ${s.ref ? `data-ref="${d.id}:${s.ref}" tabindex="0" role="button"` : ''}><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>${edgeLabel((x1 + x2) / 2, y - 6, i + 1 + '. ' + s.label)}</g>`
							})
							.join('') +
						'</svg>'
					text = `<ol>${b.steps.map(s => `<li>${esc(b.participants.find(p => p.id === s.from).label)} → ${esc(b.participants.find(p => p.id === s.to).label)}: ${esc(s.label)}${s.ref ? ' (' + refChip(d, s.ref) + ')' : ''}</li>`).join('')}</ol>`
				} else if (b.kind === 'flow') {
					// layered left-to-right by longest path
					const depth = {}
					const inc = id => b.edges.filter(e => e.to === id)
					const rank = id => {
						if (depth[id] != null) return depth[id]
						const ins = inc(id)
						depth[id] = ins.length
							? 1 + Math.max(...ins.map(e => rank(e.from)))
							: 0
						return depth[id]
					}
					b.nodes.forEach(n => rank(n.id))
					const layers = {}
					b.nodes.forEach(n => {
						;(layers[depth[n.id]] ??= []).push(n)
					})
					const W = 130,
						H = 32,
						gx = 60,
						gy = 24
					const cols = Object.keys(layers).length
					const rows = Math.max(
						...Object.values(layers).map(l => l.length),
					)
					const width = cols * W + (cols - 1) * gx + 20,
						height = rows * H + (rows - 1) * gy + 20
					const pos = {}
					Object.entries(layers).forEach(([c, ns]) =>
						ns.forEach((n, r) => {
							pos[n.id] = {
								x: 10 + c * (W + gx),
								y:
									10 +
									r * (H + gy) +
									((rows - ns.length) * (H + gy)) / 2,
							}
						}),
					)
					svg =
						`<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Data flow: ${esc(b.title || '')}">${ARROW}` +
						b.edges
							.map(e => {
								const a = pos[e.from],
									c = pos[e.to]
								const x1 = a.x + W,
									y1 = a.y + H / 2,
									x2 = c.x,
									y2 = c.y + H / 2
								const mx = (x1 + x2) / 2
								return `<g class="edge"><path d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"/>${edgeLabel(mx, (y1 + y2) / 2 - 6, e.label)}</g>`
							})
							.join('') +
						b.nodes
							.map(n =>
								node(
									d,
									pos[n.id].x,
									pos[n.id].y,
									W,
									H,
									n.label,
									n.ref,
								),
							)
							.join('') +
						'</svg>'
					text = `<ol>${b.edges.map(e => `<li>${esc(b.nodes.find(n => n.id === e.from).label)} → ${esc(b.nodes.find(n => n.id === e.to).label)}${e.label ? ' (' + esc(e.label) + ')' : ''}</li>`).join('')}</ol>`
				}
				return { svg, text }
			}

			// ---------- Center: the real diff's place ----------
			function renderCenter() {
				const c = el('center')
				if (S.scenario === 'empty') {
					c.innerHTML = `<div class="subbar guidebar"><div class="acts"><button class="ctl quiet" disabled>Overview</button></div></div><div class="emptyPage"><div class="card"><h1>No changes to review yet.</h1><p>The guide for this desk has no domains: nothing to explain. Changes appear when your agent reloads the desk, with a guide for them.</p></div></div>`
					return
				}
				if (S.scenario === 'file') {
					c.innerHTML = `<div class="fhead"><div class="row"><span class="path">plans/guided-review.md</span><span class="tag verdict-pending">Rendered</span><span class="counts"><span class="a">+40</span><span class="d">−0</span></span><button class="ctl keep">Approve <kbd>⇧A</kbd></button></div></div><div class="diffwrap"><div class="diff">${rows('docs/hub.md')}</div></div>`
					return
				}
				const f = FILES[S.fileIdx]
				const ds = domains()
				const owners = ds.filter(d =>
					units(d).some(u => u.path === f.path),
				)
				const guidebar = `<div class="subbar guidebar"><div class="acts"><button class="ctl quiet ${S.paneOpen ? 'on' : ''}" id="paneBtn" title="Explanation (g)">Explain <kbd>g</kbd></button><button class="ctl quiet" id="treeBtn" title="Files (⇧B)" style="display:none">Files</button><button class="ctl quiet" title="Previous change in domain ({)" data-unitstep="-1">‹ change</button><button class="ctl quiet" title="Next change in domain (})" data-unitstep="1">change ›</button><button class="ctl quiet" title="Previous file (⇧←)" data-filestep="-1">‹ file</button><button class="ctl quiet" title="Next file (⇧→)" data-filestep="1">file ›</button></div><div class="acts">${S.scenario === 'reload' ? '<span class="tag stale">Guide partly stale</span>' : ''}<button class="ctl quiet" id="overviewBtn">Overview <kbd>o</kbd></button></div></div>`
				const head = `<div class="fhead"><div class="row"><span class="path">${esc(f.path)}</span><span class="counts"><span class="a">+${f.added}</span><span class="d">−${f.removed}</span></span><button class="ctl keep">Approve <kbd>⇧A</kbd></button></div>${owners.length ? `<div class="owners">${owners.map(o => `<span><span class="tag" data-risk="${o.risk}">${RISK_LABEL[o.risk]}</span><span class="label">${esc(o.title)}</span></span>`).join('')}</div>` : ''}</div>`
				c.innerHTML =
					guidebar +
					head +
					`<div class="diffwrap" id="diffwrap"><div class="diff">${rows(f.path)}</div></div>`
				document.getElementById('treeBtn').style.display = matchMedia(
					'(max-width:1100px)',
				).matches
					? ''
					: 'none'
				if (S.cursor) {
					const r = c.querySelector(
						`.ln[data-side="${S.cursor.side}"][data-line="${S.cursor.line}"]`,
					)
					if (r) {
						r.classList.add('cur')
						r.scrollIntoView({ block: 'center' })
					}
				}
			}
			function rows(path) {
				const code = codeFor(path)
				const unitsHere = allUnits().filter(u => u.path === path)
				const lines = []
				const all = new Set(
					[
						...Object.keys(code.additions),
						...Object.keys(code.deletions),
					].map(Number),
				)
				const sortedLines = [...all].sort((a, b) => a - b)
				let lastRendered = 0
				let out = ''
				const unitAt = (side, l) =>
					unitsHere.find(
						u => u.side === side && l >= u.from && l <= u.to,
					)
				const ctxRefs = domains().flatMap(d =>
					d.refs
						.filter(r => r.path === path && r.role === 'context')
						.map(r => ({ ...r, domain: d })),
				)
				for (const l of sortedLines) {
					if (lastRendered && l > lastRendered + 1)
						out += `<div class="hunk">@@ … ${l - lastRendered - 1} unchanged lines @@</div>`
					const del = code.deletions[l]
					const add = code.additions[l]
					if (del !== undefined) {
						const u = unitAt('deletions', l)
						out += `<div class="ln del" data-side="deletions" data-line="${l}"><span class="no">${l}</span><span class="m">−</span><span class="c">${esc(del)}</span></div>`
						if (u && l === u.to) out += verdict(u)
					}
					if (add !== undefined) {
						const u = unitAt('additions', l)
						const ctx = ctxRefs.find(r => r.line === l)
						if (ctx)
							out += `<div class="contextNote">◌ Supporting context for <b>${esc(ctx.domain.title)}</b> — unchanged code, read-only, not a change to approve.</div>`
						out += `<div class="ln ${u ? 'add' : 'ctx'}" data-side="additions" data-line="${l}"><span class="no">${l}</span><span class="m">${u ? '+' : ' '}</span><span class="c">${esc(add)}</span></div>`
						if (u && l === u.to) out += verdict(u)
					}
					lastRendered = l
				}
				return out
			}
			function verdict(u) {
				const dec = S.decisions[u.key]
				const owner = domains().find(d => d.units.includes(u.key))
				return `<div class="verdict" data-verdict-for="${u.key}">${dec ? `<span class="tag ${dec === 'accepted' ? 'verdict-done' : 'verdict-objection'}">${dec === 'accepted' ? 'Kept' : 'Undone'}</span><button class="ctl quiet" data-reset="${u.key}">Reset</button>` : `<button class="ctl" data-decide="${u.key}:rejected">Undo <kbd>⇧N</kbd></button><button class="ctl keep" data-decide="${u.key}:accepted">Keep <kbd>⇧Y</kbd></button>`}<span class="who">${owner ? esc(owner.title) : 'not in the guide'}</span></div>`
			}

			// ---------- Actions ----------
			function selectDomain(id, opts = {}) {
				if (!opts.keepReturn) S.returnStack = []
				S.domainId = id
				const d = currentDomain()
				const u = units(d)[0]
				if (u) {
					S.fileIdx = FILES.findIndex(f => f.path === u.path)
					S.cursor = { side: u.side, line: u.from }
				}
				S.composer = null
				render()
				if (opts.focusPane) {
					el('explain')
						.querySelector('h2')
						?.scrollIntoView({ block: 'start' })
				}
			}
			function stepDomain(dir) {
				const ds = domains()
				const i = ds.findIndex(d => d.id === S.domainId)
				const n = ds[(i + dir + ds.length) % ds.length]
				selectDomain(n.id)
				toast(`Domain ${ds.indexOf(n) + 1} of ${ds.length}`)
			}
			function stepUnit(dir) {
				const us = units(currentDomain())
				if (!us.length) return
				let i = us.findIndex(isCurrentUnit)
				i = (i + dir + us.length) % us.length
				jumpToUnit(us[i])
			}
			function jumpToUnit(u) {
				pushReturn()
				S.fileIdx = FILES.findIndex(f => f.path === u.path)
				S.cursor = { side: u.side, line: u.from }
				render()
				flashCursor()
			}
			function pushReturn() {
				const body = el('exBody')
				S.returnStack.push({
					domainId: S.domainId,
					fileIdx: S.fileIdx,
					cursor: S.cursor,
					paneScroll: body ? body.scrollTop : 0,
					diffScroll: el('diffwrap')?.scrollTop || 0,
				})
				if (S.returnStack.length > 8) S.returnStack.shift()
			}
			function goBack() {
				const r = S.returnStack.pop()
				if (!r) {
					toast('Nowhere to go back to')
					return
				}
				S.domainId = r.domainId
				S.fileIdx = r.fileIdx
				S.cursor = r.cursor
				render()
				const body = el('exBody')
				if (body) body.scrollTop = r.paneScroll
				if (el('diffwrap')) el('diffwrap').scrollTop = r.diffScroll
				flashCursor()
				toast('Back')
			}
			function followRef(key) {
				const [domainId, refId] = key.split(':')
				const d = domains().find(x => x.id === domainId)
				const r = d.refs.find(x => x.id === refId)
				if (S.unresolved.has(key)) {
					toast(
						`Unresolved: ${r.path} ${r.side === 'deletions' ? 'old' : 'new'} line ${r.line} no longer exists`,
					)
					return
				}
				pushReturn()
				S.fileIdx = FILES.findIndex(f => f.path === r.path)
				S.cursor = { side: r.side, line: r.line }
				render()
				flashCursor()
				toast(
					`${r.role === 'context' ? 'Context: ' : ''}${r.path}:${r.line}`,
				)
			}
			function flashCursor() {
				const r = document.querySelector('.ln.cur')
				if (r) {
					r.classList.remove('flash')
					void r.offsetWidth
					r.classList.add('flash')
				}
			}
			function decide(key, status) {
				S.decisions[key] = status
				render()
				toast(status === 'accepted' ? 'Kept' : 'Undone')
			}
			function openComposer(domainId, blockId, intent) {
				S.composer = { domainId, blockId: blockId || null, intent }
				render()
				setTimeout(() => el('composerText')?.focus(), 0)
			}
			function submit(intent) {
				const ta = el('composerText')
				const body = (ta?.value || '').trim()
				if (!body) return
				const t = {
					target: {
						domainId: S.composer.domainId,
						blockId: S.composer.blockId,
					},
					intent,
					body,
					replies: [],
				}
				S.threads.push(t)
				S.composer = null
				render()
				toast(
					intent === 'question'
						? 'Asked — waiting for the agent'
						: 'Change requested',
				)
				if (intent === 'question')
					setTimeout(() => {
						t.replies.push(
							intent === 'question' && t.target.blockId
								? 'The transition back to Live is only reachable through an open that reuses the live desk during the grace period (hub.ts:122 guards the delete). Nothing in the dashboard can call close() twice on one desk; the second returns false.'
								: 'The drain hands the queued review to the parked waiter synchronously, so a Send that was queued before close() is delivered or saved to resultJson, never dropped.',
						)
						render()
						toast('Agent replied')
					}, 1600)
			}

			function applyScenario(name) {
				S.scenario = name
				S.stale = new Set()
				S.unresolved = new Set()
				S.unassigned = []
				S.many = false
				S.decisions = {}
				S.threads = []
				S.composer = null
				S.returnStack = []
				S.cursor = null
				S.fileIdx = 0
				S.domainId = 'desk-lifecycle'
				if (name === 'reload') {
					S.stale.add('desk-lifecycle')
					S.unresolved.add('desk-lifecycle:grace')
					S.unassigned = ['u9']
					S.decisions = {
						u3: 'accepted',
						u4: 'accepted',
						u6: 'accepted',
					}
					S.threads = [
						{
							target: {
								domainId: 'desk-lifecycle',
								blockId: 'states',
							},
							intent: 'question',
							body: 'Why can Closing go back to Live?',
							replies: [
								'Only through an open that reuses the live desk during the grace period.',
							],
							stale: true,
						},
					]
				}
				if (name === 'many') {
					S.many = true
				}
				if (name === 'default') {
					S.decisions = { u3: 'accepted' }
				}
				document
					.querySelectorAll('[data-scn]')
					.forEach(b =>
						b.classList.toggle('on', b.dataset.scn === name),
					)
				const d = currentDomain()
				const u = d && units(d)[0]
				if (u) {
					S.fileIdx = FILES.findIndex(f => f.path === u.path)
					S.cursor = { side: u.side, line: u.from }
				}
				render()
			}

			// ---------- Events ----------
			document.addEventListener('click', e => {
				const t = e.target.closest(
					'[data-scn],[data-domain],[data-step],[data-unit],[data-ref],[data-decide],[data-reset],[data-compose],[data-tab],[data-file],[data-unitstep],[data-filestep],#backBtn,#paneBtn,#overviewBtn,#appearanceBtn,#composerCancel,#composerAsk,#composerRequest,#closePane,#treeBtn,[data-jump-unassigned],[data-detail] summary',
				)
				if (!t) return
				if (t.dataset.scn) return applyScenario(t.dataset.scn)
				if (t.id === 'appearanceBtn') {
					S.appearance = S.appearance === 'light' ? 'dark' : 'light'
					return render()
				}
				if (t.dataset.domain !== undefined) {
					e.preventDefault()
					return selectDomain(t.dataset.domain, { focusPane: true })
				}
				if (t.dataset.step) return stepDomain(+t.dataset.step)
				if (t.dataset.unit)
					return jumpToUnit(allUnits().find(u => u.key === t.dataset.unit))
				if (t.dataset.ref) return followRef(t.dataset.ref)
				if (t.dataset.decide) {
					const [k, s] = t.dataset.decide.split(':')
					return decide(k, s)
				}
				if (t.dataset.reset) {
					delete S.decisions[t.dataset.reset]
					return render()
				}
				if (t.dataset.compose)
					return openComposer(
						t.dataset.compose,
						t.dataset.block,
						t.dataset.intent,
					)
				if (t.dataset.tab) {
					S.tab = t.dataset.tab
					return render()
				}
				if (t.dataset.file !== undefined) {
					S.fileIdx = +t.dataset.file
					S.cursor = null
					S.asideOpen = false
					return render()
				}
				if (t.dataset.unitstep) return stepUnit(+t.dataset.unitstep)
				if (t.dataset.filestep) {
					S.fileIdx =
						(S.fileIdx + +t.dataset.filestep + FILES.length) %
						FILES.length
					S.cursor = null
					return render()
				}
				if (t.id === 'backBtn') return goBack()
				if (t.id === 'paneBtn' || t.id === 'closePane') {
					S.paneOpen = !S.paneOpen
					return render()
				}
				if (t.id === 'treeBtn') {
					S.asideOpen = !S.asideOpen
					return render()
				}
				if (t.id === 'overviewBtn') {
					S.tab = 'domains'
					S.asideOpen = true
					return render()
				}
				if (t.id === 'composerCancel') {
					S.composer = null
					return render()
				}
				if (t.id === 'composerAsk') return submit('question')
				if (t.id === 'composerRequest') return submit('action')
				if (t.dataset.jumpUnassigned !== undefined) {
					// The unassigned unit itself (RELOAD_UNITS u9), not a line another domain already owns.
					S.fileIdx = FILES.findIndex(f => f.path === RELOAD_UNITS[0].path)
					S.cursor = { side: 'additions', line: RELOAD_UNITS[0].from }
					S.tab = 'tree'
					return render()
				}
			})
			// The draft follows the store, not the DOM: a redraw re-renders it from S.composer.body.
			document.addEventListener('input', e => {
				if (e.target.id === 'composerText' && S.composer) S.composer.body = e.target.value
			})
			document.addEventListener(
				'toggle',
				e => {
					const d = e.target.closest('[data-detail]')
					if (!d) return
					if (d.open) S.expanded.add(d.dataset.detail)
					else S.expanded.delete(d.dataset.detail)
				},
				true,
			)
			document.addEventListener('keydown', e => {
				const typing = e.target.matches('textarea,input')
				if (e.key === 'Escape') {
					if (S.composer) {
						S.composer = null
						render()
					} else if (S.asideOpen) {
						S.asideOpen = false
						render()
					}
					return
				}
				if (typing) {
					if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
						e.preventDefault()
						submit(e.shiftKey ? 'question' : 'action')
					}
					return
				}
				if (
					e.target.matches('.node,.edge') &&
					(e.key === 'Enter' || e.key === ' ')
				) {
					e.preventDefault()
					followRef(e.target.dataset.ref)
					return
				}
				const k = e.key
				if (k === ']') stepDomain(1)
				else if (k === '[') stepDomain(-1)
				else if (k === '}') stepUnit(1)
				else if (k === '{') stepUnit(-1)
				else if (k === 'b') goBack()
				else if (k === 'g') {
					S.paneOpen = !S.paneOpen
					render()
				} else if (k === 'w') {
					S.tab = S.tab === 'domains' ? 'tree' : 'domains'
					render()
				} else if (k === 'o') {
					S.tab = 'domains'
					S.asideOpen = true
					render()
				} else if (k === 'Y' && e.shiftKey) {
					const u = allUnits().find(isCurrentUnit)
					if (u) decide(u.key, 'accepted')
				} else if (k === 'N' && e.shiftKey) {
					const u = allUnits().find(isCurrentUnit)
					if (u) decide(u.key, 'rejected')
				} else if (k === 'ArrowRight' && e.shiftKey) {
					S.fileIdx = (S.fileIdx + 1) % FILES.length
					S.cursor = null
					render()
				} else if (k === 'ArrowLeft' && e.shiftKey) {
					S.fileIdx = (S.fileIdx - 1 + FILES.length) % FILES.length
					S.cursor = null
					render()
				} else if (k === 'B' && e.shiftKey) {
					S.asideOpen = !S.asideOpen
					render()
				} else return
				e.preventDefault()
			})
			matchMedia('(max-width:1100px)').addEventListener('change', render)
			applyScenario('default')
		</script>
	</body>
</html>
