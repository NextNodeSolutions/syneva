# Landing deploy: Cloudflare Workers (static assets + one on-demand route), CI-only —
# the NextNodeSolutions/core deploy-workers.yml pipeline reads this file
# (plan → quality → provision → D1 migrate → deploy); local machines never deploy.
[project]
name = "syneva-landing"
type = "app"
# The reviewed app runs locally by design; this site is the public apex
# (syneva.dev in prod, dev.syneva.dev in dev).
domain = "syneva.dev"
# Quality scripts are root-only pnpm scripts, not turbo tasks -
# filter=false runs the matrix with plain pnpm.
filter = false

[environment]
development = true

[deploy]
target = "cloudflare-workers"

[deploy.services.web]
url = "syneva.dev"
# @astrojs/cloudflare prerenders every page into dist/client, served as static
# assets without the script; the Worker answers only the on-demand route
# (POST /api/subscribe) and addresses no asset matches; public/healthz rides
# along for the smoke check.
entry = "apps/landing/dist/server/entry.mjs"
needs = ["d1"]
# Welcome email via Resend from hello@syneva.dev (GitHub env-secret in dev and prod).
secrets = ["RESEND_API_KEY"]

# Signup abuse guard per client address (env.RL_SUBSCRIBE): a few tries a
# minute is plenty for one person.
[[deploy.services.web.rate_limiters]]
name = "subscribe"
limit = 5
period = 60

# Launch list DB (env.DB); the pipeline applies the migrations on every deploy.
[services.d1]
migrations_folder = "apps/landing/migrations"

[scripts]
lint = "lint"
test = false # repo policy: no test suite yet
build = false # the workflow's pnpm build (turbo) builds apps/landing/dist
