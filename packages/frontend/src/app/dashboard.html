<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="theme-color" content="#f6f6f0" />
		<title>Syneva hub</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23f6f6f0%27/%3E%3Cg stroke=%27%230e6582%27 stroke-width=%272%27 fill=%27none%27%3E%3Cpath d=%27M16 3v7m0 12v7M3 16h7m12 0h7M7 7l5 5m8 8 5 5M7 25l5-5m8-8 5-5%27/%3E%3Cpath d=%27m10 16 6-6 6 6-6 6Z%27/%3E%3C/g%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="/styles.css" />
		<style>
			/* No global reset or :focus-visible rule here on purpose: this sheet is shared with the desk, and an unlayered rule would outrank the components' StyleX classes, which carry the one focus ring. */
			html {
				background: var(--paper, #f6f6f0);
			}
			/* The page is an application frame: its columns scroll, the document does not. */
			body {
				overflow: hidden;
			}
			@media (max-width: 750px) {
				body {
					overflow: auto;
				}
				/* The open drawer holds the page still beneath its veil. */
				html:has([data-drawer-open]) {
					overflow: hidden;
				}
			}
			/* A modal sheet holds the page still beneath it. */
			html:has(dialog[open]) {
				overflow: hidden;
			}
			body {
				margin: 0;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			h1,
			h2,
			h3,
			p,
			ul,
			ol,
			figure,
			dl,
			dd,
			fieldset,
			legend {
				margin: 0;
				padding: 0;
			}
			ul,
			ol {
				list-style: none;
			}
			fieldset {
				border: 0;
				min-width: 0;
			}
			a {
				color: inherit;
				text-decoration: none;
			}
			button,
			input,
			select {
				font: inherit;
				color: inherit;
			}
			svg {
				display: block;
			}
			/* Chromium shows the datalist triangle through an !important user-agent rule, which only an !important author rule hides. */
			input::-webkit-calendar-picker-indicator {
				display: none !important;
			}
			/* The browser's own surfaces carry the palette too, in both appearances. */
			::selection {
				background: var(--wash, #dcedf4);
				color: var(--ink, #191b18);
			}
			* {
				scrollbar-color: var(--line-strong, #a8afa1) transparent;
			}
			/* A move between pages: the page beside the sidebar fades out over the next one, which
			   shows at once and plays its own entrance (its groups and rows step in); one motion
			   per move, never a rise on top of a rise. The sidebar, outside the named group, holds
			   still. */
			::view-transition-old(hub-page) {
				animation: 140ms cubic-bezier(0.2, 0, 0, 1) both hub-page-out;
			}
			::view-transition-new(hub-page) {
				animation: none;
			}
			/* Everything else swaps at once: the browser's own crossfade of the rest of the page
			   would ghost the sidebar's old highlight over the new one, and its groups would
			   stretch the move to 250ms. */
			::view-transition-old(root) {
				display: none;
			}
			::view-transition-new(root),
			::view-transition-group(root),
			::view-transition-group(hub-page) {
				animation: none;
			}
			@keyframes hub-page-out {
				to {
					opacity: 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation: none !important;
					transition: none !important;
					scroll-behavior: auto !important;
				}
				::view-transition-old(hub-page),
				::view-transition-new(hub-page) {
					animation: none !important;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/dashboard.js"></script>
	</body>
</html>
