<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="theme-color" content="#f6f6f0" />
		<title>Syneva hub</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23f6f6f0%27/%3E%3Cg stroke=%27%230e6582%27 stroke-width=%272%27 fill=%27none%27%3E%3Cpath d=%27M16 3v7m0 12v7M3 16h7m12 0h7M7 7l5 5m8 8 5 5M7 25l5-5m8-8 5-5%27/%3E%3Cpath d=%27m10 16 6-6 6 6-6 6Z%27/%3E%3C/g%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="/styles.css" />
		<style>
			/* The hub dashboard speaks the public site's language (@syneva/design-system).
			   These rules are the page's own: the shared stylesheet also serves the desk,
			   so a reset there would reach it. There is no global :focus-visible rule here
			   on purpose: an unlayered rule in this sheet would outrank the components'
			   StyleX classes, which carry the one focus ring. */
			html {
				color-scheme: light;
				background: var(--paper, #f6f6f0);
			}
			/* A modal sheet holds the page still beneath it. */
			html:has(dialog[open]) {
				overflow: hidden;
			}
			body {
				margin: 0;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			h1,
			h2,
			h3,
			p,
			ul,
			ol,
			figure,
			dl,
			dd,
			fieldset,
			legend {
				margin: 0;
				padding: 0;
			}
			ul,
			ol {
				list-style: none;
			}
			fieldset {
				border: 0;
				min-width: 0;
			}
			a {
				color: inherit;
				text-decoration: none;
			}
			button,
			input,
			select {
				font: inherit;
				color: inherit;
			}
			svg {
				display: block;
			}
			/* A field with suggestions (New review's Repository) keeps them on typing and
			   arrow keys, without the platform's dropdown triangle in the well. Chromium
			   shows that triangle through an !important user-agent rule, which only an
			   !important author rule outranks. */
			input::-webkit-calendar-picker-indicator {
				display: none !important;
			}
			::selection {
				background: #dcedf4;
				color: #191b18;
			}
			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation: none !important;
					transition: none !important;
					scroll-behavior: auto !important;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/dashboard.js"></script>
	</body>
</html>
